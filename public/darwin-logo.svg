<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Darwin logo: branching gene-regulatory network forming a "D" -->

  <!-- bowl edges (branching arc) -->
  <path d="M10 8 L26 9 L33 13 L37 19 L39 24 L37 29 L33 35 L26 39 L10 40"
        stroke="#0D7377" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- stem edge -->
  <path d="M10 8 L10 24 L10 40" stroke="#0D7377" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- interior regulatory link from stem hub through center to bowl tip -->
  <path d="M10 24 L20 24 L39 24" stroke="#0D7377" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.55" fill="none"/>

  <!-- bowl branch nodes -->
  <circle cx="26" cy="9" r="2" fill="#0D7377"/>
  <circle cx="33" cy="13" r="2" fill="#0D7377"/>
  <circle cx="37" cy="19" r="2" fill="#0D7377"/>
  <circle cx="37" cy="29" r="2" fill="#0D7377"/>
  <circle cx="33" cy="35" r="2" fill="#0D7377"/>
  <circle cx="26" cy="39" r="2" fill="#0D7377"/>

  <!-- interior hub node -->
  <circle cx="20" cy="24" r="2.4" fill="#D4A843"/>

  <!-- stem nodes -->
  <circle cx="10" cy="8" r="3.4" fill="#0D7377"/>
  <circle cx="10" cy="24" r="3" fill="#0D7377"/>
  <circle cx="10" cy="40" r="3.4" fill="#0D7377"/>

  <!-- terminal accent node (D apex) -->
  <circle cx="39" cy="24" r="3.6" fill="#D4A843"/>
</svg>
