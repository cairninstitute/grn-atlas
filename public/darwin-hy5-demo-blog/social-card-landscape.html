<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>HY5 Social Card — Landscape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background: #0f172a; color: #f8fafc; }
  .card { width: 1200px; height: 630px; display: flex; position: relative; }
  .left { width: 520px; padding: 48px 40px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .right { width: 680px; position: relative; overflow: hidden; }
  .badge { display: inline-block; background: #0f766e; color: #fff; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; padding: 5px 14px; border-radius: 20px; margin-bottom: 20px; text-transform: uppercase; }
  h1 { font-size: 38px; font-weight: 800; line-height: 1.15; margin-bottom: 16px; letter-spacing: -0.5px; }
  h1 .accent { color: #5eead4; }
  .subtitle { font-size: 17px; color: #94a3b8; line-height: 1.5; margin-bottom: 28px; }
  .stats { display: flex; gap: 28px; margin-bottom: 32px; }
  .stat-box { text-align: left; }
  .stat-num { font-size: 26px; font-weight: 800; color: #5eead4; }
  .stat-label { font-size: 11.5px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .brand { font-size: 14px; color: #64748b; }
  .brand strong { color: #94a3b8; font-weight: 600; }
  .glow { position: absolute; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(15,118,110,0.25) 0%, transparent 70%); top: 50%; left: -60px; transform: translateY(-50%); z-index: 1; }
</style>
</head>
