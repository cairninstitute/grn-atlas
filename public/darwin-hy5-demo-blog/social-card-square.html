<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>HY5 Social Card — Square</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background: #0f172a; color: #f8fafc; }
  .card { width: 1080px; height: 1080px; display: flex; flex-direction: column; position: relative; }
  .top { padding: 48px 56px 24px; z-index: 2; }
  .middle { flex: 1; display: flex; justify-content: center; align-items: center; padding: 0 24px; }
  .bottom { padding: 20px 56px 44px; z-index: 2; }
  .badge { display: inline-block; background: #0f766e; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; padding: 6px 16px; border-radius: 20px; margin-bottom: 16px; text-transform: uppercase; }
  h1 { font-size: 44px; font-weight: 800; line-height: 1.12; letter-spacing: -0.5px; }
  h1 .accent { color: #5eead4; }
  .subtitle { font-size: 18px; color: #94a3b8; line-height: 1.5; margin-top: 12px; }
  .stats { display: flex; gap: 40px; justify-content: center; }
  .stat-box { text-align: center; }
  .stat-num { font-size: 32px; font-weight: 800; color: #5eead4; }
  .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .divider { width: 100%; height: 1px; background: #1e293b; margin: 16px 0; }
  .brand { font-size: 15px; color: #64748b; text-align: center; }
  .brand strong { color: #94a3b8; font-weight: 600; }
  .glow1 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(15,118,110,0.2) 0%, transparent 70%); top: 35%; left: 50%; transform: translate(-50%,-50%); z-index: 0; }
</style>
</head>
